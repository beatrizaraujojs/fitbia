services: 
  nginx: 
    image: nginx:stable-alpine 
    container_name: fitbia_nginx 
    ports: 
      - "8080:80" 
    volumes: 
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf 
    depends_on: 
      - php 
    networks: 
      - fitbia_network 
 
  php: 
    build: 
      context: . 
      dockerfile: ./docker/php/Dockerfile 
    container_name: fitbia_php 
    working_dir: /var/www/html 
    volumes: 
      - ./src:/var/www/html
    depends_on: 
      - mysql 
    networks: 
      - fitbia_network 
 
  mysql: 
    image: mysql:8.0
    ports:
      - "3304:3306"
    container_name: fitbia_mysql 
    restart: unless-stopped 
    environment: 
      MYSQL_DATABASE: fitbia 
      MYSQL_USER: user 
      MYSQL_PASSWORD: user 
      MYSQL_ROOT_PASSWORD: root 
    volumes: 
      - mysql_data:/var/lib/mysql 
    networks: 
      - fitbia_network 
 
networks: 
  fitbia_network: 
    driver: bridge 

      
volumes: 
  mysql_data: 
